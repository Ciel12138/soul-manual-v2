/* Soul Manual v2 — 琉璃渐变 · 极简诗意 */
/* Brand CSS for soul-manual-v2 design project */

:root {
  /* ---------- Brand primary hue: low-saturation violet-blue ---------- */
  --soul-primary-50: #f5f4ff;
  --soul-primary-100: #eeecff;
  --soul-primary-200: #ded9ff;
  --soul-primary-300: #c4bfff;
  --soul-primary-400: #a296f8;
  --soul-primary-500: #7e6ee3;
  --soul-primary-600: #6452c6;
  --soul-primary-700: #4f3e9f;
  --soul-primary-800: #41357d;
  --soul-primary-900: #362f64;
  --soul-primary-950: #211a3b;

  /* ---------- Neutral scale: warm ink on pearl ---------- */
  --soul-neutral-50: #faf9f7;
  --soul-neutral-100: #f5f3ef;
  --soul-neutral-200: #e8e5de;
  --soul-neutral-300: #d6d2c8;
  --soul-neutral-400: #b0aa9c;
  --soul-neutral-500: #8a8377;
  --soul-neutral-600: #6b655b;
  --soul-neutral-700: #4f4b44;
  --soul-neutral-800: #33312d;
  --soul-neutral-900: #1c1b19;
  --soul-neutral-950: #10100e;

  /* ---------- Semantic aliases (light mode) ---------- */
  --soul-background: var(--soul-neutral-50);
  --soul-foreground: var(--soul-neutral-900);
  --soul-card: rgba(255, 255, 255, 0.78);
  --soul-card-foreground: var(--soul-neutral-800);
  --soul-popover: rgba(255, 255, 255, 0.92);
  --soul-popover-foreground: var(--soul-neutral-900);
  --soul-primary: var(--soul-primary-500);
  --soul-primary-foreground: #ffffff;
  --soul-muted: var(--soul-neutral-100);
  --soul-muted-foreground: var(--soul-neutral-500);
  --soul-border: rgba(120, 113, 108, 0.14);
  --soul-input: rgba(120, 113, 108, 0.14);
  --soul-ring: var(--soul-primary-300);

  /* ---------- Radius scale (max 16px) ---------- */
  --soul-radius-small: 6px;
  --soul-radius-medium: 10px;
  --soul-radius-large: 16px;

  /* ---------- State colors (semantic only) ---------- */
  --soul-state-success: #2d7a5a;
  --soul-state-warning: #b3892b;
  --soul-state-error: #b34a4a;
  --soul-state-info: #4a6fa5;

  /* ---------- Typography ---------- */
  --soul-font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --soul-font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
  --soul-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", ui-monospace, monospace;

  /* ---------- Motion tokens ---------- */
  --soul-duration-fast: 180ms;
  --soul-duration-normal: 320ms;
  --soul-duration-slow: 680ms;
  --soul-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --soul-ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --soul-background: var(--soul-neutral-950);
    --soul-foreground: var(--soul-neutral-100);
    --soul-card: rgba(30, 28, 38, 0.72);
    --soul-card-foreground: var(--soul-neutral-100);
    --soul-popover: rgba(30, 28, 38, 0.9);
    --soul-popover-foreground: var(--soul-neutral-100);
    --soul-primary: var(--soul-primary-400);
    --soul-primary-foreground: var(--soul-neutral-950);
    --soul-muted: rgba(255, 255, 255, 0.06);
    --soul-muted-foreground: var(--soul-neutral-400);
    --soul-border: rgba(255, 255, 255, 0.1);
    --soul-input: rgba(255, 255, 255, 0.1);
    --soul-ring: var(--soul-primary-600);
    --soul-state-success: #5ab68a;
    --soul-state-warning: #e3b255;
    --soul-state-error: #e07575;
    --soul-state-info: #7aa3d6;
  }
}

/* ---------- Base typography classes ---------- */
.soul-text-display {
  font-family: var(--soul-font-sans);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.12;
}

.soul-text-title {
  font-family: var(--soul-font-sans);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.22;
}

.soul-text-heading {
  font-family: var(--soul-font-sans);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.soul-text-body {
  font-family: var(--soul-font-sans);
  font-weight: 400;
  letter-spacing: 0.01em;
  line-height: 1.75;
}

.soul-text-serif-quote {
  font-family: var(--soul-font-serif);
  font-weight: 400;
  letter-spacing: 0.02em;
  line-height: 1.8;
}

.soul-text-label {
  font-family: var(--soul-font-sans);
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1.2;
  text-transform: uppercase;
}

.soul-text-mono {
  font-family: var(--soul-font-mono);
  font-weight: 400;
  letter-spacing: 0;
  line-height: 1.6;
}

/* ---------- Glass surface utilities ---------- */
.soul-glass {
  background: var(--soul-card);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--soul-border);
}

.soul-glass-strong {
  background: var(--soul-popover);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid var(--soul-border);
}

/* ---------- Gradient aurora backgrounds ---------- */
.soul-aurora {
  background:
    radial-gradient(ellipse at 20% 20%, rgba(126, 110, 227, 0.18) 0%, transparent 45%),
    radial-gradient(ellipse at 80% 10%, rgba(142, 197, 252, 0.16) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 90%, rgba(255, 183, 197, 0.12) 0%, transparent 45%),
    var(--soul-background);
}

@media (prefers-color-scheme: dark) {
  .soul-aurora {
    background:
      radial-gradient(ellipse at 20% 20%, rgba(162, 150, 248, 0.14) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 10%, rgba(120, 180, 250, 0.12) 0%, transparent 40%),
      radial-gradient(ellipse at 50% 90%, rgba(240, 160, 180, 0.1) 0%, transparent 45%),
      var(--soul-background);
  }
}

/* ---------- Subtle float animation ---------- */
@keyframes soul-float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}

@keyframes soul-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes soul-pulse-glow {
  0%, 100% { opacity: 0.45; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.04); }
}

@keyframes soul-fade-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.soul-animate-float {
  animation: soul-float 6s ease-in-out infinite;
}

.soul-animate-fade-up {
  animation: soul-fade-up 0.7s var(--soul-ease-out) both;
}

/* ---------- Gradient text ---------- */
.soul-gradient-text {
  background: linear-gradient(135deg, var(--soul-primary-500), #8bc5fc 55%, #f0a8c6 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

@media (prefers-color-scheme: dark) {
  .soul-gradient-text {
    background: linear-gradient(135deg, var(--soul-primary-300), #a8d4ff 55%, #f6b8cc 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
}

/* ---------- Decorative gradient orbs ---------- */
.soul-orb {
  position: absolute;
  border-radius: 9999px;
  filter: blur(60px);
  pointer-events: none;
  opacity: 0.5;
  animation: soul-pulse-glow 8s ease-in-out infinite;
}

.soul-orb-violet {
  background: radial-gradient(circle, rgba(126, 110, 227, 0.35), transparent 70%);
}

.soul-orb-blue {
  background: radial-gradient(circle, rgba(139, 197, 252, 0.3), transparent 70%);
}

.soul-orb-rose {
  background: radial-gradient(circle, rgba(255, 183, 197, 0.28), transparent 70%);
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .soul-animate-float,
  .soul-animate-fade-up,
  .soul-orb {
    animation: none;
  }
}

  <script>
    (function(){
      const canvas = document.getElementById('aurora-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      const orbs = [];
      const orbCount = 4;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      function initOrbs() {
        orbs.length = 0;
        const palette = [
          { r: 126, g: 110, b: 227 },
          { r: 139, g: 197, b: 252 },
          { r: 240, g: 168, b: 198 }
        ];
        for (let i = 0; i < orbCount; i++) {
          const c = palette[i % palette.length];
          orbs.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: 100 + Math.random() * 160,
            vx: (Math.random() - 0.5) * 0.2,
            vy: (Math.random() - 0.5) * 0.2,
            color: `rgba(${c.r}, ${c.g}, ${c.b}, 0.16)`,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        ctx.fillStyle = isDark ? '#10100e' : '#faf9f7';
        ctx.fillRect(0, 0, width, height);

        for (const o of orbs) {
          o.x += o.vx;
          o.y += o.vy;
          o.phase += 0.005;

          if (o.x < -o.r) o.x = width + o.r;
          if (o.x > width + o.r) o.x = -o.r;
          if (o.y < -o.r) o.y = height + o.r;
          if (o.y > height + o.r) o.y = -o.r;

          const pulse = 1 + Math.sin(o.phase) * 0.08;
          const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * pulse);
          g.addColorStop(0, o.color);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }

      resize();
      initOrbs();
      draw();
      window.addEventListener('resize', () => { resize(); initOrbs(); });
    })();
  </script>

  <script>
    (function(){
      const gridEl = document.getElementById('card-grid');
      const statsEl = document.getElementById('stats-bar');
      const tocEl = document.getElementById('toc');
      const searchInput = document.getElementById('search-input');
      const modal = document.getElementById('reader-modal');
      const modalBackdrop = document.getElementById('modal-backdrop');
      const modalShell = document.getElementById('modal-shell');
      const modalTitle = document.getElementById('modal-title');
      const modalMeta = document.getElementById('modal-meta');
      const modalBody = document.getElementById('modal-body');
      const modalCounter = document.getElementById('modal-counter');
      const modalProgressBar = document.getElementById('modal-progress-bar');
      const btnScrollTop = document.getElementById('btn-scroll-top');
      let sections = [];
      let currentIndex = -1;
      let fontSizeIndex = 1;
      const fontSizeValues = ['0.875rem', '1rem', '1.125rem', '1.25rem'];

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function slugify(s) {
        return 'h-' + s.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
      }

      function inline(s) {
        return s
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
      }

      function parseMarkdown(md) {
        const lines = md.split(/\r?\n/);
        const result = [];
        let current = null;
        let buffer = [];
        let sectionIndex = 0;

        function flush() {
          if (!current && buffer.length) {
            current = { level: 3, text: '序言', id: slugify('序言'), body: [] };
            sectionIndex++;
          }
          if (current) {
            current.raw = buffer.join('\n');
            result.push(current);
          }
          buffer = [];
        }

        for (let line of lines) {
          const h1 = line.match(/^#\s+(.+)$/);
          const h2 = line.match(/^##\s+(.+)$/);
          const h3 = line.match(/^###\s+(.+)$/);
          if (h1 || h2 || h3) {
            flush();
            const text = (h1 || h2 || h3)[1];
            const level = h1 ? 1 : h2 ? 2 : 3;
            current = { level, text, id: slugify(text + '-' + sectionIndex), body: [] };
            sectionIndex++;
            continue;
          }
          if (current) current.body.push(line);
          buffer.push(line);
        }
        flush();
        return result;
      }

      function renderBody(lines) {
        let html = '';
        let inList = false;
        let listType = null;
        let inBlockquote = false;

        function closeList() {
          if (inList) {
            html += listType === 'ol' ? '</ol>' : '</ul>';
            inList = false;
            listType = null;
          }
        }
        function closeBlockquote() {
          if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
        }

        for (let line of lines) {
          if (line.trim() === '---') { closeList(); closeBlockquote(); html += '<hr>'; continue; }
          const bq = line.match(/^>\s*(.*)$/);
          if (bq) { closeList(); if (!inBlockquote) { html += '<blockquote>'; inBlockquote = true; } html += `<p>${inline(escapeHtml(bq[1]))}</p>`; continue; }
          closeBlockquote();
          const ul = line.match(/^\s*[-*]\s+(.+)$/);
          const ol = line.match(/^\s*\d+\.\s+(.+)$/);
          if (ul) { if (!inList) { html += '<ul>'; inList = true; listType = 'ul'; } html += `<li>${inline(escapeHtml(ul[1]))}</li>`; continue; }
          if (ol) { if (!inList) { html += '<ol>'; inList = true; listType = 'ol'; } html += `<li>${inline(escapeHtml(ol[1]))}</li>`; continue; }
          closeList();
          if (line.trim() === '') { html += '<br>'; }
          else { html += `<p>${inline(escapeHtml(line))}</p>`; }
        }
        closeList(); closeBlockquote();
        return html;
      }

      function excerpt(lines, max = 140) {
        const text = lines.join(' ').replace(/\*\*|\*|`/g, '').trim();
        if (!text) return '（本节为章节标题）';
        return text.length > max ? text.slice(0, max) + '…' : text;
      }

      function highlightMatch(text, q) {
        if (!q) return escapeHtml(text);
        const re = new RegExp('(' + escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        return escapeHtml(text).replace(re, '<mark class="bg-[var(--soul-primary-200)] text-[var(--soul-primary-900)] rounded px-0.5">$1</mark>');
      }

      function wordCount(lines) {
        return lines.join('').replace(/\s/g, '').length;
      }

      function renderCards(filter = '') {
        const q = filter.trim().toLowerCase();
        const filtered = q ? sections.filter(s => s.text.toLowerCase().includes(q) || s.raw.toLowerCase().includes(q)) : sections;
        if (!filtered.length) {
          gridEl.innerHTML = `<div class="col-span-full soul-glass rounded-[var(--soul-radius-large)] p-10 text-center text-[var(--soul-muted-foreground)]">没有找到与“${escapeHtml(q)}”相关的卡片</div>`;
          return;
        }
        gridEl.innerHTML = filtered.map((s, i) => {
          const sectionIndex = sections.indexOf(s);
          return `
          <article class="source-card soul-glass rounded-[var(--soul-radius-large)] p-7 flex flex-col h-full cursor-pointer group soul-animate-fade-up" style="animation-delay: ${Math.min(i * 0.05, 0.5)}s" data-index="${sectionIndex}" data-id="${s.id}">
            <div class="flex items-start justify-between gap-3 mb-3">
              <span class="text-[10px] soul-text-label tracking-[0.15em] text-[var(--soul-primary)]">SECTION ${String(sectionIndex + 1).padStart(2, '0')}</span>
              <span class="text-xs text-[var(--soul-muted-foreground)]">${wordCount(s.body)} 字</span>
            </div>
            <h3 class="soul-text-heading text-lg mb-3 group-hover:text-[var(--soul-primary)] transition-colors line-clamp-2">${highlightMatch(s.text, q)}</h3>
            <p class="text-sm text-[var(--soul-muted-foreground)] mb-5 flex-1 line-clamp-3">${highlightMatch(excerpt(s.body), q)}</p>
            <div class="flex items-center justify-between pt-4 border-t border-[var(--soul-border)]">
              <span class="text-xs text-[var(--soul-muted-foreground)]">${s.level === 1 ? '一级章节' : s.level === 2 ? '二级章节' : '三级章节'}</span>
              <span class="inline-flex items-center gap-1 text-sm text-[var(--soul-primary)] group-hover:translate-x-1 transition-transform">
                阅读 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </span>
            </div>
          </article>
        `;
        }).join('');

        gridEl.querySelectorAll('.source-card').forEach(card => {
          card.addEventListener('click', () => openModal(parseInt(card.dataset.index, 10)));
        });
      }

      function buildToc() {
        if (!sections.length) return;
        let html = '';
        for (const s of sections) {
          const indent = (s.level - 1) * 14;
          html += `<a href="#${s.id}" class="toc-link block text-[var(--soul-muted-foreground)]" style="margin-left:${indent}px" data-id="${s.id}">${escapeHtml(s.text)}</a>`;
        }
        tocEl.innerHTML = html;
        tocEl.querySelectorAll('a').forEach(a => {
          a.addEventListener('click', e => {
            e.preventDefault();
            const idx = sections.findIndex(s => s.id === a.dataset.id);
            if (idx >= 0) openModal(idx);
          });
        });
      }

      function updateStats() {
        statsEl.innerHTML = `
          <span class="soul-glass px-3 py-1.5 rounded-full text-xs text-[var(--soul-muted-foreground)]">${sections.length} 张卡片</span>
          <span class="soul-glass px-3 py-1.5 rounded-full text-xs text-[var(--soul-muted-foreground)]">${sections.reduce((a, s) => a + wordCount(s.body), 0).toLocaleString()} 字</span>
          <span class="soul-glass px-3 py-1.5 rounded-full text-xs text-[var(--soul-muted-foreground)]">点击卡片可阅读 / 分享</span>
        `;
      }

      function applyFontSize() {
        modalBody.style.fontSize = fontSizeValues[fontSizeIndex];
      }

      function updateActiveToc() {
        tocEl.querySelectorAll('a').forEach(a => a.classList.remove('active'));
        if (currentIndex < 0) return;
        const active = tocEl.querySelector(`a[data-id="${sections[currentIndex].id}"]`);
        if (active) {
          active.classList.add('active');
          active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }

      function updateProgress() {
        if (!modalBody.scrollHeight) return;
        const scrolled = modalBody.scrollTop;
        const total = modalBody.scrollHeight - modalBody.clientHeight;
        const pct = total > 0 ? (scrolled / total) * 100 : 0;
        modalProgressBar.style.width = pct + '%';
        const showTop = scrolled > 240;
        btnScrollTop.style.opacity = showTop ? '1' : '0';
        btnScrollTop.style.pointerEvents = showTop ? 'auto' : 'none';
        btnScrollTop.style.transform = showTop ? 'translateY(0)' : 'translateY(0.5rem)';
      }

      function openModal(index) {
        if (index < 0 || index >= sections.length) return;
        currentIndex = index;
        const s = sections[index];
        modalTitle.textContent = s.text;
        modalMeta.textContent = `SECTION ${String(index + 1).padStart(2, '0')} · ${wordCount(s.body)} 字`;
        modalBody.innerHTML = renderBody(s.body);
        modalBody.scrollTop = 0;
        modalCounter.textContent = `${index + 1} / ${sections.length}`;
        applyFontSize();
        updateActiveToc();
        modalProgressBar.style.width = '0%';
        modal.classList.remove('pointer-events-none');
        requestAnimationFrame(() => {
          modal.classList.remove('opacity-0');
          modalBackdrop.classList.remove('opacity-0');
          modalShell.classList.remove('translate-y-6', 'md:translate-y-0', 'scale-[0.98]', 'opacity-0');
        });
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        history.replaceState(null, '', '#' + s.id);
      }

      function closeModal() {
        modal.classList.add('opacity-0');
        modalBackdrop.classList.add('opacity-0');
        modalShell.classList.add('translate-y-6', 'md:translate-y-0', 'scale-[0.98]', 'opacity-0');
        setTimeout(() => {
          modal.classList.add('pointer-events-none');
          modal.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
          currentIndex = -1;
          tocEl.querySelectorAll('a').forEach(a => a.classList.remove('active'));
        }, 300);
        history.replaceState(null, '', location.pathname);
      }

      async function shareCurrent() {
        if (currentIndex < 0) return;
        const s = sections[currentIndex];
        const url = location.origin + location.pathname + '#' + s.id;
        const data = { title: s.text + ' · 小九灵魂说明书', text: excerpt(s.body, 120), url };
        try {
          if (navigator.share) { await navigator.share(data); }
          else { await navigator.clipboard.writeText(url); alert('链接已复制：' + url); }
        } catch (e) {
          await navigator.clipboard.writeText(url).catch(() => {});
        }
      }

      async function copyCurrent() {
        if (currentIndex < 0) return;
        const s = sections[currentIndex];
        const text = `# ${s.text}\n\n${s.body.join('\n')}`;
        try {
          await navigator.clipboard.writeText(text);
          const btn = document.getElementById('btn-copy');
          const original = btn.innerHTML;
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
          btn.classList.add('copy-success');
          setTimeout(() => { btn.innerHTML = original; btn.classList.remove('copy-success'); }, 1400);
        } catch (e) {
          alert('复制失败，请手动复制');
        }
      }

      function adjustFontSize(delta) {
        fontSizeIndex = Math.max(0, Math.min(fontSizeValues.length - 1, fontSizeIndex + delta));
        applyFontSize();
      }

      document.getElementById('btn-close').addEventListener('click', closeModal);
      modalBackdrop.addEventListener('click', closeModal);
      document.getElementById('btn-prev').addEventListener('click', () => openModal(currentIndex - 1));
      document.getElementById('btn-next').addEventListener('click', () => openModal(currentIndex + 1));
      document.getElementById('btn-prev-mobile').addEventListener('click', () => openModal(currentIndex - 1));
      document.getElementById('btn-next-mobile').addEventListener('click', () => openModal(currentIndex + 1));
      document.getElementById('btn-share').addEventListener('click', shareCurrent);
      document.getElementById('btn-copy').addEventListener('click', copyCurrent);
      document.getElementById('btn-font-dec').addEventListener('click', () => adjustFontSize(-1));
      document.getElementById('btn-font-inc').addEventListener('click', () => adjustFontSize(1));
      btnScrollTop.addEventListener('click', () => modalBody.scrollTo({ top: 0, behavior: 'smooth' }));
      modalBody.addEventListener('scroll', updateProgress, { passive: true });

      let touchStartX = 0;
      let touchStartY = 0;
      modalShell.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });
      modalShell.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 56) {
          if (dx < 0) openModal(currentIndex + 1);
          else openModal(currentIndex - 1);
        }
      }, { passive: true });

      document.addEventListener('keydown', e => {
        if (modal.classList.contains('pointer-events-none')) return;
        if (e.key === 'Escape') closeModal();
        if (e.key === 'ArrowLeft') openModal(currentIndex - 1);
        if (e.key === 'ArrowRight') openModal(currentIndex + 1);
      });

      fetch('../assets/soul-manual.md')
        .then(r => { if (!r.ok) throw new Error('无法加载原文'); return r.text(); })
        .then(md => {
          sections = parseMarkdown(md);
          updateStats();
          buildToc();
          renderCards();
          const hash = location.hash.replace('#', '');
          const idx = sections.findIndex(s => s.id === hash);
          if (idx >= 0) openModal(idx);
        })
        .catch(err => {
          gridEl.innerHTML = `<div class="col-span-full soul-glass rounded-[var(--soul-radius-large)] p-10 text-center text-[var(--soul-state-error)]">加载原文失败：${escapeHtml(err.message)}</div>`;
        });

      let searchDebounce;
      if (searchInput) {
        searchInput.addEventListener('input', e => {
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(() => renderCards(e.target.value), 180);
        });
      }
    })();
  </script>
