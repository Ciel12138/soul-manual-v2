<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>琉璃壁纸生成器 · 无水印</title>
  <style>
    :root {
      --bg: #f5f4ff;
      --ink: #362f64;
      --primary: #7e6ee3;
      --card: rgba(255,255,255,0.85);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    h1 { font-weight: 500; margin-bottom: 8px; }
    p.sub { margin: 0 0 28px; opacity: 0.7; }
    .controls {
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 8px 32px rgba(80,60,180,0.1);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
      max-width: 640px;
    }
    button {
      border: none;
      background: var(--primary);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(126,110,227,0.35); }
    button.secondary { background: rgba(126,110,227,0.12); color: var(--primary); }
    .preview-wrap {
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(80,60,180,0.1);
    }
    canvas { display: block; max-width: 90vw; max-height: 60vh; border-radius: 12px; }
    .size-label { text-align: center; margin-top: 12px; font-size: 13px; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>琉璃壁纸生成器</h1>
  <p class="sub">点击按钮生成无水印高清壁纸，右键或下载保存</p>

  <div class="controls">
    <button onclick="drawPhone()">手机壁纸 1800×2048</button>
    <button onclick="drawDesktop()">电脑壁纸 2048×1800</button>
    <button class="secondary" onclick="downloadWallpaper()">下载当前壁纸</button>
  </div>

  <div class="preview-wrap">
    <canvas id="c" width="1800" height="2048"></canvas>
  </div>
  <div class="size-label" id="label">手机壁纸 1800×2048</div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');

    function drawGradient(w, h) {
      c.width = w; c.height = h;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#f5f4ff';
      ctx.fillRect(0, 0, w, h);

      // base soft gradient
      const g1 = ctx.createLinearGradient(0, 0, w, h);
      g1.addColorStop(0, '#e8e5ff');
      g1.addColorStop(0.45, '#c4bfff');
      g1.addColorStop(0.75, '#ffd6e8');
      g1.addColorStop(1, '#ffe8f0');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, w, h);

      // violet-blue glow
      const g2 = ctx.createRadialGradient(w * 0.2, h * 0.15, 0, w * 0.3, h * 0.3, w * 0.7);
      g2.addColorStop(0, 'rgba(160, 150, 248, 0.55)');
      g2.addColorStop(0.6, 'rgba(160, 150, 248, 0.1)');
      g2.addColorStop(1, 'rgba(160, 150, 248, 0)');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, w, h);

      // pink glow
      const g3 = ctx.createRadialGradient(w * 0.85, h * 0.75, 0, w * 0.75, h * 0.7, w * 0.65);
      g3.addColorStop(0, 'rgba(255, 180, 200, 0.5)');
      g3.addColorStop(0.5, 'rgba(255, 180, 200, 0.12)');
      g3.addColorStop(1, 'rgba(255, 180, 200, 0)');
      ctx.fillStyle = g3;
      ctx.fillRect(0, 0, w, h);

      // subtle light spots
      ctx.globalCompositeOperation = 'screen';
      const spots = [
        {x: 0.12, y: 0.22, r: 0.08, a: 0.35},
        {x: 0.78, y: 0.18, r: 0.1, a: 0.28},
        {x: 0.55, y: 0.45, r: 0.12, a: 0.22},
        {x: 0.25, y: 0.72, r: 0.09, a: 0.3},
        {x: 0.88, y: 0.82, r: 0.11, a: 0.26},
        {x: 0.42, y: 0.88, r: 0.07, a: 0.2},
      ];
      spots.forEach(s => {
        const rg = ctx.createRadialGradient(s.x * w, s.y * h, 0, s.x * w, s.y * h, s.r * Math.max(w, h));
        rg.addColorStop(0, `rgba(255,255,255,${s.a})`);
        rg.addColorStop(0.4, `rgba(255,255,255,${s.a * 0.4})`);
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r * Math.max(w, h), 0, Math.PI * 2);
        ctx.fill();
      });

      // tiny sparkles
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      for (let i = 0; i < 60; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = Math.random() * 1.8 + 0.5;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPhone() {
      drawGradient(1800, 2048);
      document.getElementById('label').textContent = '手机壁纸 1800×2048';
    }

    function drawDesktop() {
      drawGradient(2048, 1800);
      document.getElementById('label').textContent = '电脑壁纸 2048×1800';
    }

    function downloadWallpaper() {
      const isDesktop = c.width > c.height;
      const link = document.createElement('a');
      link.download = isDesktop ? 'liuli-wallpaper-desktop.jpg' : 'liuli-wallpaper-phone.jpg';
      link.href = c.toDataURL('image/jpeg', 0.92);
      link.click();
    }

    drawPhone();
  </script>
</body>
</html>
